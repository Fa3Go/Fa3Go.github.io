<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射擊遊戲</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #6fa8ff;
            --accent-amber: #ff9d5c;
            --bg-panel: rgba(14, 18, 30, 0.78);
            --text-dim: #93a1bd;
            --text-bright: #eaf0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 50% 15%, #1a2440 0%, #0a0e1a 55%, #05060c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(111, 168, 255, 0.18),
                0 0 40px rgba(111, 168, 255, 0.12);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
            touch-action: none;
        }

        #gameUI {
            position: absolute;
            top: 14px;
            left: 16px;
            color: var(--text-bright);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.65;
            pointer-events: none;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        #gameUI .label {
            color: var(--text-dim);
            font-weight: 500;
        }

        #highScore {
            color: var(--accent-amber);
        }

        .panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: var(--bg-panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 34px 44px;
            border: 1px solid rgba(111, 168, 255, 0.25);
            border-radius: 14px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            display: none;
            min-width: 260px;
        }

        .panel.danger {
            border-color: rgba(255, 157, 92, 0.3);
        }

        .panel h1, .panel .title {
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 18px;
            color: var(--text-bright);
        }

        .panel.danger .title {
            color: var(--accent-amber);
        }

        .panel p {
            font-size: 14px;
            margin: 8px 0;
            color: var(--text-dim);
            font-weight: 500;
        }

        .panel .stat-line {
            font-size: 17px;
            color: var(--text-bright);
            font-weight: 600;
            margin-top: 12px;
        }

        .panel .stat-line span {
            color: var(--accent-blue);
            font-weight: 700;
        }

        #newRecord, #newRecordComplete {
            display: none;
            color: #6cd68f;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .sf-btn {
            margin-top: 22px;
            padding: 11px 34px;
            font-size: 15px;
            background: linear-gradient(180deg, #6fa8ff 0%, #3f74d6 100%);
            border: none;
            border-radius: 8px;
            color: #06101f;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 6px 16px rgba(63, 116, 214, 0.4);
            transition: filter 0.15s ease, transform 0.1s ease;
            pointer-events: auto;
        }

        .sf-btn:hover {
            filter: brightness(1.08);
        }

        .sf-btn:active {
            transform: scale(0.97);
        }

        .panel.danger .sf-btn {
            background: linear-gradient(180deg, #ffb27a 0%, #e07f3f 100%);
            box-shadow: 0 6px 16px rgba(224, 127, 63, 0.4);
        }

        #pauseBtn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            color: var(--text-bright);
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            pointer-events: auto;
        }

        #pauseBtn:active {
            transform: scale(0.92);
        }

        #touchControls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 14px;
            pointer-events: none;
        }

        #touchControls button {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-bright);
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(6px);
        }

        body.touch-device #touchControls {
            display: flex;
        }

        body.touch-device #pauseBtn {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600" tabindex="0" style="outline: none;"></canvas>

        <div id="gameUI">
            <div><span class="label">關卡</span> <span id="level">1</span></div>
            <div><span class="label">分數</span> <span id="score">0</span></div>
            <div><span class="label">生命</span> <span id="lives">3</span></div>
            <div><span class="label">最高分</span> <span id="highScore">0</span></div>
        </div>

        <button id="pauseBtn" onclick="togglePause()">II</button>

        <div id="startScreen" class="panel" style="display: block;">
            <h1>太空射擊</h1>
            <p>← → 移動飛船 / 拖曳畫面移動</p>
            <p>SPACE 發射子彈（手機自動發射）</p>
            <p>P 暫停</p>
            <p>消滅所有敵人！</p>
            <div class="stat-line">最高分 <span id="startHighScore">0</span></div>
            <button class="sf-btn" onclick="startGame()">開始遊戲</button>
        </div>

        <div id="pauseScreen" class="panel">
            <div class="title">暫停中</div>
            <button class="sf-btn" onclick="togglePause()">繼續遊戲</button>
        </div>

        <div id="touchControls">
            <button id="touchLeft">◀</button>
            <button id="touchRight">▶</button>
        </div>

        <div id="gameOver" class="panel danger">
            <div class="title">遊戲結束</div>
            <div class="stat-line">最終分數 <span id="finalScore">0</span></div>
            <div id="newRecord">新紀錄！</div>
            <button class="sf-btn" onclick="restartGame()">重新開始</button>
        </div>

        <div id="levelComplete" class="panel">
            <div class="title">關卡完成</div>
            <p>準備進入下一關...</p>
        </div>

        <div id="gameComplete" class="panel">
            <div class="title">恭喜過關</div>
            <p>你完成了所有關卡！</p>
            <div class="stat-line">最終分數 <span id="finalScoreComplete">0</span></div>
            <div id="newRecordComplete">新紀錄！</div>
            <button class="sf-btn" onclick="restartGame()">重新開始</button>
        </div>
    </div>

    <script src="space-shooter.js"></script>
</body>
</html>
