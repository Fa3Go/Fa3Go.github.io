<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - 作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            overflow: hidden;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            opacity: 0.9;
        }

        .manual-switch {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .switch-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .switch-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script>
        // Device detection and redirect
        (function() {
            // Check for manual override
            const forceDesktop = localStorage.getItem('forceDesktop') === 'true';
            const forceMobile = localStorage.getItem('forceMobile') === 'true';

            // Detect mobile device
            const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const isSmallScreen = window.innerWidth <= 768;
            const isMobile = isMobileDevice || isSmallScreen;

            // Determine which version to load
            let targetPage = null;

            if (forceMobile) {
                targetPage = 'mobile.html';
            } else if (forceDesktop) {
                targetPage = 'desktop.html';
            } else {
                // Auto-detect
                targetPage = isMobile ? 'mobile.html' : 'desktop.html';
            }

            // Redirect
            if (targetPage) {
                window.location.href = targetPage;
            }
        })();

        // Manual switch functions
        function goToDesktop() {
            localStorage.setItem('forceDesktop', 'true');
            localStorage.removeItem('forceMobile');
            window.location.href = 'desktop.html';
        }

        function goToMobile() {
            localStorage.setItem('forceMobile', 'true');
            localStorage.removeItem('forceDesktop');
            window.location.href = 'mobile.html';
        }
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>正在載入...</h1>
        <p>自動偵測您的裝置類型</p>

        <div class="manual-switch">
            <p style="margin-bottom: 15px;">或手動選擇版本：</p>
            <button class="switch-button" onclick="goToDesktop()">
                <i>🖥️</i> Windows 11 桌面版
            </button>
            <button class="switch-button" onclick="goToMobile()">
                <i>📱</i> iOS 手機版
            </button>
        </div>
    </div>
</body>
</html>
